{% extends 'base.html' %}
{% load static %}

{% block content %}

<h1>🎮 Список игр</h1>

<h2>Фото игры</h2>
<img class="game-image" src="{% static 'main/img/game-cover.svg' %}" alt="Обложка игры GameWorld">

<h2>Видео</h2>
<video class="game-video" controls poster="{% static 'main/img/game-cover.svg' %}">
    <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
    Ваш браузер не поддерживает видео.
</video>

<h2>Таблица игр</h2>

<table border="1" cellpadding="10">
    <tr>
        <th>Название</th>
        <th>Жанр</th>
        <th>Год</th>
        <th>Студия</th>
    </tr>
    <tr>
        <td>Cyber Adventure</td>
        <td>RPG</td>
        <td>2025</td>
        <td>GameWorld Studio</td>
    </tr>
    <tr>
        <td>Space Battle</td>
        <td>Шутер</td>
        <td>2024</td>
        <td>Orbit Games</td>
    </tr>
</table>

{% endblock %}
