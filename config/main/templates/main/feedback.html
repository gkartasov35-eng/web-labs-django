{% extends 'base.html' %}

{% block content %}
<h2>Обратная связь</h2>

<form id="feedbackForm" method="post" novalidate>
    {% csrf_token %}

    <label for="name">Имя:</label>
    <input type="text" name="name" id="name" placeholder="Введите имя" required>

    <label for="email">Email:</label>
    <input type="email" name="email" id="email" placeholder="Введите email" required>

    <label for="message">Сообщение:</label>
    <textarea name="message" id="message" placeholder="Ваше сообщение" required minlength="5"></textarea>

    <button type="submit">Отправить</button>
</form>
<p id="statusMessage"></p>
{% endblock %}

{% block scripts %}
<script>
const form = document.getElementById('feedbackForm');
const statusMessage = document.getElementById('statusMessage');
const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

form.addEventListener('submit', async function(event) {
    event.preventDefault();

    if (!form.checkValidity()) {
        statusMessage.textContent = "Пожалуйста, заполните все поля корректно.";
        statusMessage.style.color = "red";
        return;
    }

    const payload = {
        name: form.elements.name.value,
        email: form.elements.email.value,
        message: form.elements.message.value
    };

    const response = await fetch("{% url 'feedback' %}", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken,
            "X-Requested-With": "XMLHttpRequest"
        },
        body: JSON.stringify(payload)
    });

    const result = await response.json();
    statusMessage.textContent = result.message;
    statusMessage.style.color = response.ok ? "green" : "red";

    if (response.ok) {
        form.reset();
    }
});
</script>
{% endblock %}
